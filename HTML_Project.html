<!DOCTYPE HTML>
<httml>

<head>
    <meta charset="UTF-8" />
    <meta name="various" content="windth-device-width, initial-scale-1.0"/>
    <title>HTML Example</title>
</head>

<body>
<h1>HTML Form Example</h1>
<p>This an example of <del>HTML4</del> <u>HTML5</u> from containing يحتوي various <mark>input</mark> controls:</p>
<form>
        <!-- User Information -->
        <fieldset>
            <legend>User Information</legend>
            
            <label for="username">Username:</label>
            <input type="text" id="username" name="username"><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password">
        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>
            
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"><br><br>
            
            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="35"></textarea>
        </fieldset>

        <!-- Subscription -->
        <fieldset>
            <legend>Subscription</legend>
            
            <label for="sub1">Subscribe to newsletter:</label>
            <input type="checkbox" id="sub1" name="sub1"><br>
            
            <label for="sub2">Subscribe to newsletter:</label>
            <input type="checkbox" id="sub2" name="sub2">
        </fieldset>

        <!-- Preferred Language -->
        <fieldset>
            <legend>Preferred Language</legend>
            
            <label for="language">Select your preferred language:</label>
            <select id="language" name="language">
                <option value="english">English</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
                <option value="german">German</option>
            </select>
        </fieldset>

        <!-- Feedback -->
        <fieldset>
            <legend>Feedback</legend>
            
            <label for="rate">Rate our service:</label>
            <input type="range" id="rate" name="rate">
        </fieldset>

        <br>
        <!-- Form Action Buttons -->
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

</body>



</httml>
